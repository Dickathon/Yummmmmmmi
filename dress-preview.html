<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="format-detection" content="telephone=no">
  <title>Yummi Dress Preview</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules/order.css">
  <link rel="stylesheet" href="css/modules/dress-preview.css">
</head>
<body class="dress-preview-page">
  <div class="dress-preview-shell">
    <header class="dress-preview-header">
      <p class="dress-preview-header__eyebrow caption">Dress Prototype</p>
      <h1 class="dress-preview-header__title">点餐转盘调试页</h1>
      <p class="dress-preview-header__desc caption">
        用于开发和调试 order 模块转盘，不替代正式入口 `index.html`。
      </p>
    </header>

    <main class="dress-preview-workspace">
      <section class="dress-preview-device" aria-label="移动端预览">
        <div class="dress-preview-device__frame">
          <div class="dress-preview-device__notch" aria-hidden="true"></div>
          <div class="dress-preview-device__screen">
            <section class="dress-preview-hero">
              <p class="dress-preview-hero__kicker caption">Module Preview</p>
              <h2 class="dress-preview-hero__title" data-preview-title></h2>
              <p class="dress-preview-hero__desc caption" data-preview-desc></p>
            </section>

            <div class="dress-preview-module" data-dress-preview-mount></div>
          </div>
        </div>
      </section>

      <aside class="card dress-preview-notes">
        <div class="dress-preview-notes__block">
          <h2 class="dress-preview-notes__title">当前边界</h2>
          <ul class="dress-preview-notes__list">
            <li>挂载 order 模块转盘脚本与样式，不改主框架。</li>
            <li>预览目标按手机端 375px 视口调试，适配 360px 到 430px。</li>
            <li>所有内容默认离线运行，不引入远程资源和第三方依赖。</li>
          </ul>
        </div>

        <div class="dress-preview-notes__block">
          <h2 class="dress-preview-notes__title">调试操作</h2>
          <div class="panel-actions">
            <button type="button" class="btn btn--primary" data-preview-action="remount">
              重新挂载
            </button>
            <button type="button" class="btn btn--secondary" data-preview-action="toggle">
              暂停动效
            </button>
          </div>
        </div>

        <div class="dress-preview-notes__block">
          <h2 class="dress-preview-notes__title">回填方式</h2>
          <p class="caption">
            转盘已位于
            <code>js/modules/order/</code> 与 <code>css/modules/order.css</code>。
          </p>
        </div>
      </aside>
    </main>
  </div>

  <script>
    window.Yummi = window.Yummi || {};
    window.Yummi.modules = window.Yummi.modules || {};
  </script>
  <script src="js/core/util.js"></script>
  <script src="js/modules/order/items-catalog.js"></script>
  <script src="js/modules/order/placards.js"></script>
  <script src="js/modules/order/config.js"></script>
  <script src="js/modules/order/state.js"></script>
  <script src="js/modules/order/view.js"></script>
  <script src="js/modules/order/screen.js"></script>
  <script src="js/modules/order/preview.js"></script>
</body>
</html>
