<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>美食街区 - Yummi</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/social-map.css">
</head>
<body class="map-body">
  <div class="map-page" id="mapPage">
    <header class="map-header">
      <a href="index.html" class="map-back" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <h1 class="map-title">美食街区</h1>
      <span class="map-subtitle">宁静小巷，风味相逢</span>
    </header>

    <main class="map-main" id="mapMain">
      <div class="map-street" id="mapStreet"></div>
    </main>

    <div class="map-preview" id="mapPreview" aria-hidden="true">
      <div class="map-preview__overlay" id="mapPreviewOverlay"></div>
      <div class="map-preview__card" id="mapPreviewCard">
        <button type="button" class="map-preview__close" id="mapPreviewClose" aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <img class="map-preview__img" id="mapPreviewImg" src="" alt="">
        <div class="map-preview__body">
          <h2 class="map-preview__name" id="mapPreviewName"></h2>
          <span class="map-preview__tag" id="mapPreviewTag"></span>
          <p class="map-preview__desc" id="mapPreviewDesc"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/social-map.js"></script>
</body>
</html>
