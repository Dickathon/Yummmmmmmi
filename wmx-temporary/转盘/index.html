<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>椭圆转盘</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/modules/order.css">
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--color-bg);
    }

    .turntable-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .turntable-page__mount {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body class="order-immersive">
  <div class="turntable-page">
    <div class="turntable-page__mount order-module" data-turntable-mount></div>
  </div>

  <script>
    window.Yummi = window.Yummi || { modules: {} };
  </script>
  <script src="../../js/core/util.js"></script>
  <script src="../../js/modules/order/items-catalog.js"></script>
  <script src="../../js/modules/order/placards.js"></script>
  <script src="../../js/modules/order/config.js"></script>
  <script src="../../js/modules/order/state.js"></script>
  <script src="../../js/modules/order/view.js"></script>
  <script src="../../js/modules/order/screen.js"></script>
  <script>
    (function () {
      "use strict";

      var mod = window.Yummi.modules.order;
      var mount = document.querySelector("[data-turntable-mount]");
      var instance = null;

      function mountTurntable() {
        if (!mod || !mod.screen || !mount) return;

        if (instance) {
          instance.onHide();
          instance.unmount(mount);
        }

        instance = mod.screen.create({});
        instance.mount(mount, {});
        instance.onShow();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", mountTurntable);
      } else {
        mountTurntable();
      }

      window.addEventListener("beforeunload", function () {
        if (!instance) return;
        instance.onHide();
        instance.unmount(mount);
      });
    })();
  </script>
</body>
</html>
