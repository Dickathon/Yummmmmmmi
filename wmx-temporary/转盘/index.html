<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>椭圆转盘调参页</title>
  <style>
    :root {
      --color-primary: #5c4b3a;
      --color-bg: #f5f0e8;
      --color-text: #3d3d3d;
      --color-text-muted: #8b7355;
      --color-accent-light: #c4a882;
      --color-paper: #e8dfd1;
      --color-sakura: #f4e1e1;
      --color-matcha: #8fbc8f;
      --color-bamboo: #9caf88;
      --shadow-soft: 0 14px 34px rgba(92, 75, 58, 0.08);
      --shadow-lift: 0 22px 44px rgba(92, 75, 58, 0.1);
      --radius-block: 20px;
      --radius-pill: 999px;
      --max-width: 430px;
      --transition-base: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--color-text);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.88), transparent 34%),
        linear-gradient(180deg, #fbf7f2 0%, var(--color-bg) 100%);
      letter-spacing: 0.02em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(92, 75, 58, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92, 75, 58, 0.016) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(calc(100% - 24px), var(--max-width));
      margin: 0 auto;
      padding: 18px 0 36px;
      display: grid;
      gap: 18px;
    }

    .turntable-root {
      position: relative;
      padding-top: 6px;
      touch-action: none;
      user-select: none;
    }

    .turntable {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .status {
      margin-top: 8px;
      min-height: 2.8em;
      color: var(--color-text-muted);
      font-size: 0.83rem;
      line-height: 1.72;
      letter-spacing: 0.04em;
    }

    .controls-root {
      display: grid;
      gap: 16px;
    }

    .control-group {
      padding: 16px 14px;
      border-radius: var(--radius-block);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(196, 168, 130, 0.18);
      box-shadow: var(--shadow-soft);
    }

    .control-group h2 {
      margin: 0 0 12px;
      color: var(--color-primary);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .control-grid {
      display: grid;
      gap: 12px;
    }

    .control-field {
      display: grid;
      gap: 8px;
    }

    .control-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--color-primary);
      font-size: 0.86rem;
    }

    .control-meta span:last-child {
      color: var(--color-text-muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: var(--color-primary);
      cursor: pointer;
    }

    .disc-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .disc-chip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(92, 75, 58, 0.14);
      flex: 0 0 auto;
    }

    .disc-chip.base {
      background: linear-gradient(135deg, var(--color-paper), var(--color-accent-light));
    }

    .disc-chip.mid {
      background: linear-gradient(135deg, var(--color-sakura), var(--color-paper));
    }

    .disc-chip.top {
      background: linear-gradient(135deg, var(--color-matcha), var(--color-bamboo));
    }

    .config-panel {
      display: grid;
      gap: 12px;
    }

    .config-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .config-actions p {
      margin: 0;
      color: var(--color-text-muted);
      font-size: 0.8rem;
      line-height: 1.7;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 18px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: var(--color-bg);
      font: inherit;
      font-size: 0.88rem;
      transition:
        transform var(--transition-base),
        color var(--transition-base),
        background-color var(--transition-base);
      cursor: pointer;
    }

    .copy-btn:active {
      transform: scale(0.97);
    }

    .copy-btn:hover {
      background: transparent;
      color: var(--color-primary);
    }

    .config-output {
      width: 100%;
      min-height: 220px;
      padding: 14px;
      border: 1px solid rgba(196, 168, 130, 0.22);
      border-radius: 16px;
      background: rgba(255, 253, 249, 0.96);
      color: var(--color-primary);
      font: 13px/1.7 Consolas, "SFMono-Regular", monospace;
      resize: vertical;
    }

    .turntable-hit {
      cursor: grab;
    }

    .turntable-hit:active {
      cursor: grabbing;
    }

    .turntable-hit-side {
      cursor: grab;
    }

    .turntable-hit-side:active {
      cursor: grabbing;
    }

    .turntable-face-image {
      pointer-events: none;
    }

    .turntable-side-image {
      pointer-events: none;
    }

    @media (max-width: 360px) {
      .control-group {
        padding-left: 12px;
        padding-right: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="turntable-root" id="turntable-root">
      <svg class="turntable" id="turntable" viewBox="0 0 380 398" role="img" aria-label="三层椭圆转盘"></svg>
      <p class="status" id="status">正在自动转动，拖动任意可见盘面即可单独接管。</p>
    </section>

    <section class="controls-root">
      <section class="control-group">
        <h2>全局联动</h2>
        <div class="control-grid" id="global-controls"></div>
      </section>

      <section class="control-group">
        <h2>单层微调</h2>
        <div class="control-grid" id="disc-controls"></div>
      </section>

      <section class="control-group config-panel">
        <div class="config-actions">
          <p>复制这段对象数据发给我，我就能按你调出来的位置和视角直接固化。</p>
          <button class="copy-btn" id="copy-config" type="button">复制配置</button>
        </div>
        <textarea class="config-output" id="config-output" spellcheck="false" readonly></textarea>
      </section>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var INITIAL_CONFIG = {
        global: {
          offsetX: -1,
          offsetY: -42,
          globalScale: 1.3,
          ellipseRatio: 0.8,
          discHeight: 1.02,
          layerGap: 1
        },
        discs: [
          {
            id: "base",
            x: 0,
            y: 79,
            scale: 1.12,
            heightScale: 1,
            baseRx: 150,
            baseRy: 38,
            baseCy: 286
          },
          {
            id: "mid",
            x: 0,
            y: 37,
            scale: 1.21,
            heightScale: 1,
            baseRx: 108,
            baseRy: 28,
            baseCy: 212
          },
          {
            id: "top",
            x: 0,
            y: 7,
            scale: 1.43,
            heightScale: 1,
            baseRx: 72,
            baseRy: 19,
            baseCy: 148
          },
          {
            id: "cap",
            x: 0,
            y: -14,
            scale: 1.18,
            heightScale: 1.4,
            baseRx: 48,
            baseRy: 13,
            baseCy: 102
          }
        ]
      };

      var TOP_SIDE_IMAGES = [
        "assets/cats/IMG_20260530_125819.jpg",
        "assets/cats/IMG_20260530_125904.jpg",
        "assets/cats/IMG_20260530_125935.jpg",
        "assets/cats/IMG_20260530_125618.jpg",
        "assets/cats/IMG_20260530_125748.jpg",
        "assets/cats/IMG_20260530_125756.jpg",
        "assets/cats/IMG_20260530_125605.jpg",
        "assets/cats/IMG_20260530_125740.jpg"
      ];

      var DISC_BASES = [
        {
          id: "base",
          label: "底盘",
          colorClass: "base",
          baseCx: 190,
          baseCy: 286,
          baseRx: 150,
          baseRy: 38,
          x: 0,
          y: 0,
          scale: 1,
          heightScale: 1,
          angle: 8,
          autoSpeed: 8,
          hitInnerRadius: 116,
          sectorInnerRadius: 36,
          dragging: false,
          pointerId: null,
          lastPointerAngle: null,
          angularVelocity: 0,
          inertiaBoost: 1,
          topColor: "#f5f0e8",
          capColor: "#e8dfd1",
          sideGradientId: "turntable-base-side",
          sectorColors: ["#f5f0e8", "#f0e7d9", "#e8dfd1", "#f3ebe0", "#c4a882", "#efe3d4"]
        },
        {
          id: "mid",
          label: "中盘",
          colorClass: "mid",
          baseCx: 190,
          baseCy: 212,
          baseRx: 108,
          baseRy: 28,
          x: 0,
          y: 0,
          scale: 1,
          heightScale: 1,
          angle: 24,
          autoSpeed: -12,
          hitInnerRadius: 78,
          sectorInnerRadius: 28,
          dragging: false,
          pointerId: null,
          lastPointerAngle: null,
          angularVelocity: 0,
          inertiaBoost: 1,
          topColor: "#f4e1e1",
          capColor: "#f7eeee",
          sideGradientId: "turntable-mid-side",
          sectorColors: ["#f4e1e1", "#f9efef", "#f1d7d7", "#ead1d1", "#e8dfd1", "#f8f3f1"]
        },
        {
          id: "top",
          label: "顶盘",
          colorClass: "top",
          baseCx: 190,
          baseCy: 148,
          baseRx: 72,
          baseRy: 19,
          x: 0,
          y: 0,
          scale: 1,
          heightScale: 1,
          angle: 48,
          autoSpeed: -16,
          hitInnerRadius: 0,
          sectorInnerRadius: 20,
          dragging: false,
          pointerId: null,
          lastPointerAngle: null,
          angularVelocity: 0,
          inertiaBoost: 1,
          topColor: "#8fbc8f",
          capColor: "#e8dfd1",
          sideGradientId: "turntable-top-side",
          sectorColors: ["#8fbc8f", "#a7c7a3", "#dfe9d8", "#c9dbbf", "#9caf88", "#b7d0aa"]
        },
        {
          id: "cap",
          label: "顶柱",
          colorClass: "cap",
          baseCx: 190,
          baseCy: 102,
          baseRx: 48,
          baseRy: 13,
          x: 0,
          y: 0,
          scale: 1,
          heightScale: 1,
          angle: 0,
          autoSpeed: -18,
          hitInnerRadius: 0,
          sectorInnerRadius: 0,
          dragging: false,
          pointerId: null,
          lastPointerAngle: null,
          angularVelocity: 0,
          inertiaBoost: 0.92,
          topColor: "#f0caa7",
          capColor: "#fff1df",
          sideGradientId: "turntable-cap-side",
          sectorColors: []
        }
      ];

      function createInitialState() {
        var discConfigMap = {};

        INITIAL_CONFIG.discs.forEach(function (disc) {
          discConfigMap[disc.id] = disc;
        });

        return {
          global: Object.assign({}, INITIAL_CONFIG.global),
          discs: DISC_BASES.map(function (disc) {
            return Object.assign({}, disc, discConfigMap[disc.id] || {});
          }),
          activeDiscId: null,
          lastTick: 0
        };
      }

      var state = createInitialState();

      var refs = {
        page: document.querySelector(".page"),
        turntableRoot: document.getElementById("turntable-root"),
        svg: document.getElementById("turntable"),
        status: document.getElementById("status"),
        globalControls: document.getElementById("global-controls"),
        discControls: document.getElementById("disc-controls"),
        copyButton: document.getElementById("copy-config"),
        configOutput: document.getElementById("config-output"),
        rotors: {},
        hitTarget: null,
        controlValueNodes: {},
        rafId: 0,
        carouselTimer: 0
      };

      var globalSpecs = [
        { key: "offsetX", label: "整体左右", min: -120, max: 120, step: 1 },
        { key: "offsetY", label: "整体上下", min: -120, max: 120, step: 1 },
        { key: "globalScale", label: "整体缩放", min: 0.6, max: 1.5, step: 0.01 },
        { key: "ellipseRatio", label: "扁率", min: 0.7, max: 1.35, step: 0.01 },
        { key: "discHeight", label: "厚度", min: 0.55, max: 1.5, step: 0.01 },
        { key: "layerGap", label: "层间距", min: 0.55, max: 1.5, step: 0.01 }
      ];

      var discSpecs = [
        { key: "x", label: "左右", min: -120, max: 120, step: 1 },
        { key: "y", label: "上下", min: -120, max: 120, step: 1 },
        { key: "scale", label: "缩放", min: 0.6, max: 1.5, step: 0.01 },
        { key: "heightScale", label: "厚度", min: 0.55, max: 1.6, step: 0.01 }
      ];

      function formatNumber(value) {
        return Number(value.toFixed(3));
      }

      function formatForDisplay(value) {
        return (Math.abs(value) >= 10 ? value.toFixed(0) : value.toFixed(2)).replace(/\.00$/, "");
      }

      function degToRad(angle) {
        return (angle - 90) * Math.PI / 180;
      }

      function polarToCartesian(radius, angle) {
        var rad = degToRad(angle);
        return {
          x: radius * Math.cos(rad),
          y: radius * Math.sin(rad)
        };
      }

      function normalizeAngle(angle) {
        var next = angle % 360;
        return next < 0 ? next + 360 : next;
      }

      function angleDelta(nextAngle, prevAngle) {
        var delta = nextAngle - prevAngle;
        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;
        return delta;
      }

      function createCirclePath(radius) {
        return [
          "M", formatNumber(radius), 0,
          "A", formatNumber(radius), formatNumber(radius), 0, 1, 0, formatNumber(-radius), 0,
          "A", formatNumber(radius), formatNumber(radius), 0, 1, 0, formatNumber(radius), 0,
          "Z"
        ].join(" ");
      }

      function createRingPath(outerRadius, innerRadius) {
        if (!innerRadius || innerRadius <= 0) {
          return createCirclePath(outerRadius);
        }
        return createCirclePath(outerRadius) + " " + createCirclePath(innerRadius);
      }

      function createSidePath(geometry) {
        var left = geometry.cx - geometry.rx;
        var right = geometry.cx + geometry.rx;
        var top = geometry.cy;
        var bottom = geometry.cy + geometry.height;

        return [
          "M", formatNumber(left), formatNumber(top),
          "L", formatNumber(left), formatNumber(bottom),
          "A", formatNumber(geometry.rx), formatNumber(geometry.ry), 0, 0, 0, formatNumber(right), formatNumber(bottom),
          "L", formatNumber(right), formatNumber(top),
          "A", formatNumber(geometry.rx), formatNumber(geometry.ry), 0, 0, 1, formatNumber(left), formatNumber(top),
          "Z"
        ].join(" ");
      }

      function createSideOutlinePath(geometry) {
        var left = geometry.cx - geometry.rx;
        var right = geometry.cx + geometry.rx;
        var top = geometry.cy;
        var bottom = geometry.cy + geometry.height;

        return [
          "M", formatNumber(left), formatNumber(top),
          "L", formatNumber(left), formatNumber(bottom),
          "A", formatNumber(geometry.rx), formatNumber(geometry.ry), 0, 0, 0, formatNumber(right), formatNumber(bottom),
          "L", formatNumber(right), formatNumber(top)
        ].join(" ");
      }

      function createUpperSideHitPath(geometry) {
        var left = geometry.cx - geometry.rx;
        var right = geometry.cx + geometry.rx;
        var top = geometry.cy;
        var middle = geometry.cy + (geometry.height * 0.56);

        return [
          "M", formatNumber(left), formatNumber(top),
          "L", formatNumber(left), formatNumber(middle),
          "A", formatNumber(geometry.rx), formatNumber(geometry.ry), 0, 0, 0, formatNumber(right), formatNumber(middle),
          "L", formatNumber(right), formatNumber(top),
          "A", formatNumber(geometry.rx), formatNumber(geometry.ry), 0, 0, 1, formatNumber(left), formatNumber(top),
          "Z"
        ].join(" ");
      }

      function createFrontArcPath(cx, cy, rx, ry) {
        return [
          "M", formatNumber(cx - rx), formatNumber(cy),
          "A", formatNumber(rx), formatNumber(ry), 0, 0, 0, formatNumber(cx + rx), formatNumber(cy)
        ].join(" ");
      }

      function createDonutSectorPath(innerRadius, outerRadius, startAngle, endAngle) {
        var startOuter = polarToCartesian(outerRadius, startAngle);
        var endOuter = polarToCartesian(outerRadius, endAngle);
        var startInner = polarToCartesian(innerRadius, endAngle);
        var endInner = polarToCartesian(innerRadius, startAngle);
        var largeArc = endAngle - startAngle > 180 ? 1 : 0;

        return [
          "M", formatNumber(startOuter.x), formatNumber(startOuter.y),
          "A", formatNumber(outerRadius), formatNumber(outerRadius), 0, largeArc, 1, formatNumber(endOuter.x), formatNumber(endOuter.y),
          "L", formatNumber(startInner.x), formatNumber(startInner.y),
          "A", formatNumber(innerRadius), formatNumber(innerRadius), 0, largeArc, 0, formatNumber(endInner.x), formatNumber(endInner.y),
          "Z"
        ].join(" ");
      }

      function renderSectorMarkup(disc, geometry) {
        if (!disc.sectorColors.length) {
          return "";
        }
        var outerRadius = geometry.rx - 6;
        var innerRadius = Math.max(geometry.sectorInnerRadius, 12);
        var sectorCount = disc.sectorColors.length;
        var step = 360 / sectorCount;
        var parts = [];
        var i;

        for (i = 0; i < sectorCount; i += 1) {
          var start = i * step;
          var end = start + step;
          parts.push(
            '<path d="' + createDonutSectorPath(innerRadius, outerRadius, start, end) + '"' +
              ' fill="' + disc.sectorColors[i] + '"' +
              ' stroke="#5c4b3a" stroke-opacity="0.12" stroke-width="1"></path>'
          );
        }

        for (i = 0; i < sectorCount; i += 1) {
          var tickOuter = polarToCartesian(outerRadius - 1, i * step);
          var tickInner = polarToCartesian(innerRadius + 6, i * step);
          parts.push(
            '<line x1="' + formatNumber(tickInner.x) + '" y1="' + formatNumber(tickInner.y) +
            '" x2="' + formatNumber(tickOuter.x) + '" y2="' + formatNumber(tickOuter.y) +
            '" stroke="#5c4b3a" stroke-opacity="0.46" stroke-width="1.4" stroke-linecap="round"></line>'
          );
        }

        parts.push(
          '<circle r="' + formatNumber(innerRadius - 2) + '" fill="none" stroke="#5c4b3a" stroke-opacity="0.18" stroke-width="1.2"></circle>'
        );
        parts.push(
          '<circle r="' + formatNumber(outerRadius - 4) + '" fill="none" stroke="#5c4b3a" stroke-opacity="0.18" stroke-width="1.2"></circle>'
        );
        parts.push(
          '<path d="' + createDonutSectorPath(innerRadius + 8, outerRadius - 14, 318, 394) +
          '" fill="rgba(255,255,255,0.34)"></path>'
        );

        return parts.join("");
      }

      function renderTopFace(disc, geometry) {
        var scaleY = geometry.ry / geometry.rx;

        if (disc.id === "cap") {
          return (
            '<defs>' +
              '<clipPath id="cap-texture-clip">' +
                '<ellipse cx="0" cy="0" rx="' + formatNumber(geometry.rx - 2) + '" ry="' + formatNumber(geometry.rx - 2) + '"></ellipse>' +
              "</clipPath>" +
            "</defs>" +
            '<g transform="translate(' + formatNumber(geometry.cx) + " " + formatNumber(geometry.cy) + ') scale(1 ' + formatNumber(scaleY) + ')">' +
              '<circle r="' + formatNumber(geometry.rx) + '" fill="' + geometry.topColor + '"></circle>' +
              '<g data-rotor="' + disc.id + '" transform="rotate(' + formatNumber(geometry.angle) + ')">' +
                '<g clip-path="url(#cap-texture-clip)">' +
                  '<image class="turntable-face-image" href="assets/cats/top-texture-cat.jpg" x="' + formatNumber(-geometry.rx * 1.08) + '" y="' + formatNumber(-geometry.rx * 1.08) + '" width="' + formatNumber(geometry.rx * 2.16) + '" height="' + formatNumber(geometry.rx * 2.16) + '" preserveAspectRatio="xMidYMid slice"></image>' +
                "</g>" +
              "</g>" +
              '<circle r="' + formatNumber(geometry.rx - 2) + '" fill="none" stroke="#5c4b3a" stroke-opacity="0.22" stroke-width="1.2"></circle>' +
            "</g>"
          );
        }

        return (
          '<g transform="translate(' + formatNumber(geometry.cx) + " " + formatNumber(geometry.cy) + ') scale(1 ' + formatNumber(scaleY) + ')">' +
            '<circle r="' + formatNumber(geometry.rx) + '" fill="' + geometry.topColor + '"></circle>' +
            '<g data-rotor="' + disc.id + '" transform="rotate(' + formatNumber(geometry.angle) + ')">' +
              renderSectorMarkup(disc, geometry) +
            "</g>" +
          "</g>"
        );
      }

      function renderCapSideCarousel(geometry) {
        var segmentCount = 3;
        var segmentWidth = geometry.rx * 0.56;
        var segmentHeight = geometry.height * 0.62;
        var leftBase = -geometry.rx * 0.82;
        var topBase = geometry.ry * 0.18;
        var markup = [];
        var i;

        for (i = 0; i < segmentCount; i += 1) {
          var imageHref = TOP_SIDE_IMAGES[(state.carouselIndex + i) % TOP_SIDE_IMAGES.length];
          var clipId = "cap-side-clip-" + i;
          var boxX = leftBase + (segmentWidth * i);
          var boxY = topBase;
          var radius = Math.max(1.6, geometry.ry * 0.14);

          markup.push(
            '<defs>' +
              '<clipPath id="' + clipId + '">' +
                '<rect x="' + formatNumber(boxX) + '" y="' + formatNumber(boxY) + '" width="' + formatNumber(segmentWidth) + '" height="' + formatNumber(segmentHeight) + '" rx="' + formatNumber(radius) + '" ry="' + formatNumber(radius) + '"></rect>' +
              "</clipPath>" +
            "</defs>"
          );

          markup.push(
            '<g clip-path="url(#' + clipId + ')">' +
              '<image class="turntable-side-image" href="' + imageHref + '" x="' + formatNumber(boxX) + '" y="' + formatNumber(boxY) + '" width="' + formatNumber(segmentWidth) + '" height="' + formatNumber(segmentHeight) + '" preserveAspectRatio="xMidYMid slice"></image>' +
            "</g>"
          );

          markup.push(
            '<rect x="' + formatNumber(boxX) + '" y="' + formatNumber(boxY) + '" width="' + formatNumber(segmentWidth) + '" height="' + formatNumber(segmentHeight) + '" rx="' + formatNumber(radius) + '" ry="' + formatNumber(radius) + '" fill="none" stroke="#5c4b3a" stroke-opacity="0.22" stroke-width="1.05"></rect>'
          );
        }

        return (
          '<g class="turntable-side-carousel" data-side-rotor="' + geometry.id + '" transform="rotate(' + formatNumber(geometry.angle) + ' ' + formatNumber(geometry.cx) + ' ' + formatNumber(geometry.cy) + ')">' +
            '<g transform="translate(' + formatNumber(geometry.cx) + ' ' + formatNumber(geometry.cy) + ')">' +
              '<path d="' + createFrontArcPath(0, geometry.height, geometry.rx, geometry.ry) + '" fill="none" stroke="#5c4b3a" stroke-opacity="0.18" stroke-width="1.2"></path>' +
              markup.join("") +
            "</g>" +
          "</g>"
        );
      }

      function getDiscGeometry(disc) {
        var g = state.global;
        var scale = g.globalScale * disc.scale;
        var layerUnit = (disc.baseCy - 148) / 64;

        return {
          id: disc.id,
          label: disc.label,
          colorClass: disc.colorClass,
          cx: disc.baseCx + g.offsetX + disc.x,
          cy: 148 + (layerUnit * 64 * g.layerGap) + g.offsetY + disc.y,
          rx: disc.baseRx * scale,
          ry: disc.baseRy * scale * g.ellipseRatio,
          height: 42 * g.discHeight * disc.heightScale * scale * (disc.baseRx / 72),
          angle: disc.angle,
          hitInnerRadius: disc.hitInnerRadius > 0 ? disc.hitInnerRadius * scale : 0,
          sectorInnerRadius: disc.sectorInnerRadius * scale,
          topColor: disc.topColor,
          capColor: disc.capColor,
          sideGradientId: disc.sideGradientId
        };
      }

      function getExportConfig() {
        return {
          global: {
            offsetX: formatNumber(state.global.offsetX),
            offsetY: formatNumber(state.global.offsetY),
            globalScale: formatNumber(state.global.globalScale),
            ellipseRatio: formatNumber(state.global.ellipseRatio),
            discHeight: formatNumber(state.global.discHeight),
            layerGap: formatNumber(state.global.layerGap)
          },
          discs: state.discs.map(function (disc) {
            return {
              id: disc.id,
              x: formatNumber(disc.x),
              y: formatNumber(disc.y),
              scale: formatNumber(disc.scale),
              heightScale: formatNumber(disc.heightScale),
              angularVelocity: formatNumber(disc.angularVelocity || 0),
              baseRx: formatNumber(disc.baseRx),
              baseRy: formatNumber(disc.baseRy),
              baseCy: formatNumber(disc.baseCy)
            };
          })
        };
      }

      function updateConfigOutput() {
        refs.configOutput.value =
          "const turntableConfig = " +
          JSON.stringify(getExportConfig(), null, 2) +
          ";";
      }

      function renderControlField(target, spec, value) {
        var field = document.createElement("label");
        field.className = "control-field";

        var valueNodeId = target + ":" + spec.key;
        refs.controlValueNodes[valueNodeId] = null;

        field.innerHTML =
          '<div class="control-meta">' +
            "<span>" + spec.label + "</span>" +
            '<span data-value-node="' + valueNodeId + '">' + formatForDisplay(value) + "</span>" +
          "</div>" +
          '<input type="range"' +
            ' data-target="' + target + '"' +
            ' data-key="' + spec.key + '"' +
            ' min="' + spec.min + '"' +
            ' max="' + spec.max + '"' +
            ' step="' + spec.step + '"' +
            ' value="' + value + '">' ;

        return field;
      }

      function renderControls() {
        refs.globalControls.innerHTML = "";
        refs.discControls.innerHTML = "";

        globalSpecs.forEach(function (spec) {
          refs.globalControls.appendChild(renderControlField("global", spec, state.global[spec.key]));
        });

        state.discs.forEach(function (disc) {
          var wrapper = document.createElement("div");
          wrapper.className = "control-group";
          wrapper.innerHTML =
            '<div class="disc-header">' +
              '<span class="disc-chip ' + disc.colorClass + '"></span>' +
              "<strong>" + disc.label + "</strong>" +
            "</div>";

          var grid = document.createElement("div");
          grid.className = "control-grid";

          discSpecs.forEach(function (spec) {
            grid.appendChild(renderControlField(disc.id, spec, disc[spec.key]));
          });

          wrapper.appendChild(grid);
          refs.discControls.appendChild(wrapper);
        });

        refs.page.querySelectorAll("[data-value-node]").forEach(function (node) {
          refs.controlValueNodes[node.getAttribute("data-value-node")] = node;
        });
      }

      function updateControlDisplays() {
        globalSpecs.forEach(function (spec) {
          var key = "global:" + spec.key;
          if (refs.controlValueNodes[key]) {
            refs.controlValueNodes[key].textContent = formatForDisplay(state.global[spec.key]);
          }
        });

        state.discs.forEach(function (disc) {
          discSpecs.forEach(function (spec) {
            var key = disc.id + ":" + spec.key;
            if (refs.controlValueNodes[key]) {
              refs.controlValueNodes[key].textContent = formatForDisplay(disc[spec.key]);
            }
          });
        });
      }

      function renderTurntable() {
        refs.svg.innerHTML =
          '<defs>' +
            '<linearGradient id="turntable-base-side" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0%" stop-color="#e8dfd1"></stop>' +
              '<stop offset="100%" stop-color="#c4a882"></stop>' +
            "</linearGradient>" +
            '<linearGradient id="turntable-mid-side" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0%" stop-color="#f7ecec"></stop>' +
              '<stop offset="100%" stop-color="#e8dfd1"></stop>' +
            "</linearGradient>" +
            '<linearGradient id="turntable-top-side" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0%" stop-color="#c8d8ba"></stop>' +
              '<stop offset="100%" stop-color="#8fbc8f"></stop>' +
            "</linearGradient>" +
            '<linearGradient id="turntable-cap-side" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0%" stop-color="#f5d8bb"></stop>' +
              '<stop offset="100%" stop-color="#d7a773"></stop>' +
            "</linearGradient>" +
            '<radialGradient id="turntable-floor-shadow" cx="50%" cy="50%" r="50%">' +
              '<stop offset="0%" stop-color="#5c4b3a" stop-opacity="0.16"></stop>' +
              '<stop offset="100%" stop-color="#5c4b3a" stop-opacity="0"></stop>' +
            "</radialGradient>" +
          "</defs>";

        var baseGeometry = getDiscGeometry(state.discs[0]);
        refs.svg.innerHTML +=
          '<ellipse cx="' + formatNumber(baseGeometry.cx) + '"' +
          ' cy="' + formatNumber(baseGeometry.cy + baseGeometry.height + 12) + '"' +
          ' rx="' + formatNumber(baseGeometry.rx + 8) + '"' +
          ' ry="' + formatNumber(Math.max(18, baseGeometry.ry * 0.64)) + '"' +
          ' fill="url(#turntable-floor-shadow)"></ellipse>';

        state.discs.forEach(function (disc) {
          var geometry = getDiscGeometry(disc);
          var scaleY = geometry.ry / geometry.rx;
          var capRx = Math.max(8, geometry.rx * 0.16);
          var capRy = Math.max(4, geometry.ry * 0.34);
          var centerCapMarkup = disc.id === "cap"
            ? ""
            : (
              '<g transform="translate(' + formatNumber(geometry.cx) + " " + formatNumber(geometry.cy) + ')">' +
                '<ellipse rx="' + formatNumber(capRx) + '" ry="' + formatNumber(capRy) + '" fill="' + geometry.capColor + '" stroke="#5c4b3a" stroke-width="1.5"></ellipse>' +
                '<ellipse rx="' + formatNumber(capRx * 0.52) + '" ry="' + formatNumber(capRy * 0.52) + '" fill="#ffffff" fill-opacity="0.66"></ellipse>' +
              "</g>"
            );

          refs.svg.innerHTML +=
            '<g data-disc="' + disc.id + '">' +
              '<path d="' + createSidePath(geometry) + '" fill="url(#' + geometry.sideGradientId + ')"></path>' +
              (disc.id === "cap" ? renderCapSideCarousel(geometry) : "") +
              '<path d="' + createSideOutlinePath(geometry) + '" fill="none" stroke="#5c4b3a" stroke-width="2.2" stroke-linejoin="round"></path>' +
              renderTopFace(disc, geometry) +
              '<ellipse cx="' + formatNumber(geometry.cx) + '" cy="' + formatNumber(geometry.cy) + '" rx="' + formatNumber(geometry.rx) + '" ry="' + formatNumber(geometry.ry) + '" fill="none" stroke="#5c4b3a" stroke-width="2.2"></ellipse>' +
              centerCapMarkup +
              '<g transform="translate(' + formatNumber(geometry.cx) + " " + formatNumber(geometry.cy) + ') scale(1 ' + formatNumber(scaleY) + ')">' +
                '<path class="turntable-hit" data-hit="' + disc.id + '" d="' + createRingPath(geometry.rx, geometry.hitInnerRadius) + '" fill="rgba(255,255,255,0.001)" fill-rule="evenodd"></path>' +
              "</g>" +
              '<path class="turntable-hit-side" data-hit-side="' + disc.id + '" d="' + createUpperSideHitPath(geometry) + '" fill="rgba(255,255,255,0.001)"></path>' +
            "</g>";
        });

        state.discs.forEach(function (disc) {
          refs.rotors[disc.id] = refs.svg.querySelector('[data-rotor="' + disc.id + '"]');
          refs.sideRotors = refs.sideRotors || {};
          refs.sideRotors[disc.id] = refs.svg.querySelector('[data-side-rotor="' + disc.id + '"]');
        });
      }

      function updateRotor(disc) {
        if (!refs.rotors[disc.id]) return;
        refs.rotors[disc.id].setAttribute("transform", "rotate(" + formatNumber(disc.angle) + ")");
        if (refs.sideRotors && refs.sideRotors[disc.id]) {
          var geometry = getDiscGeometry(disc);
          refs.sideRotors[disc.id].setAttribute("transform", "rotate(" + formatNumber(disc.angle) + " " + formatNumber(geometry.cx) + " " + formatNumber(geometry.cy) + ")");
        }
      }

      function updateStatus() {
        var activeDisc = state.discs.find(function (disc) {
          return disc.id === state.activeDiscId;
        }) || null;

        refs.status.textContent = activeDisc ?
          (activeDisc.label + " 正在被拖动，松手后会继续自动旋转。") :
          "正在自动转动，拖动任意可见盘面即可单独接管。";
      }

      function getSvgPoint(event) {
        var point = refs.svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        var ctm = refs.svg.getScreenCTM();
        return ctm ? point.matrixTransform(ctm.inverse()) : null;
      }

      function getDiscById(discId) {
        return state.discs.find(function (disc) {
          return disc.id === discId;
        }) || null;
      }

      function getPointerAngle(disc, svgPoint) {
        if (!disc || !svgPoint) return null;

        var geometry = getDiscGeometry(disc);
        var scaleY = geometry.ry / geometry.rx;
        var localX = svgPoint.x - geometry.cx;
        var localY = (svgPoint.y - geometry.cy) / scaleY;
        var radius = Math.sqrt((localX * localX) + (localY * localY));

        if (radius < Math.max(10, geometry.sectorInnerRadius * 0.32)) {
          return null;
        }

        return normalizeAngle((Math.atan2(localY, localX) * 180 / Math.PI) + 90);
      }

      function getExtendedPointerAngle(disc, svgPoint, hitType) {
        if (hitType === "side") {
          var geometry = getDiscGeometry(disc);
          var sideY = Math.max(geometry.cy, Math.min(svgPoint.y, geometry.cy + geometry.height));
          return getPointerAngle(disc, { x: svgPoint.x, y: sideY });
        }
        return getPointerAngle(disc, svgPoint);
      }

      function releaseDisc(pointerId) {
        state.discs.forEach(function (disc) {
          if (disc.pointerId !== pointerId) return;
          disc.dragging = false;
          disc.pointerId = null;
          disc.lastPointerAngle = null;
          disc.lastMoveTime = null;
        });
        state.activeDiscId = null;
        refs.hitTarget = null;
        updateStatus();
      }

      function handlePointerDown(event) {
        var hit = event.target.closest("[data-hit], [data-hit-side]");
        if (!hit) return;

        var hitType = hit.hasAttribute("data-hit-side") ? "side" : "top";
        var discId = hitType === "side" ? hit.getAttribute("data-hit-side") : hit.getAttribute("data-hit");
        var disc = getDiscById(discId);
        var svgPoint = getSvgPoint(event);
        var pointerAngle = getExtendedPointerAngle(disc, svgPoint, hitType);

        if (!disc || pointerAngle == null) return;

        disc.dragging = true;
        disc.pointerId = event.pointerId;
        disc.lastPointerAngle = pointerAngle;
        disc.lastMoveTime = event.timeStamp || performance.now();
        disc.angularVelocity = 0;
        state.activeDiscId = disc.id;
        refs.hitTarget = hit;

        if (typeof hit.setPointerCapture === "function") {
          hit.setPointerCapture(event.pointerId);
        }

        updateStatus();
        event.preventDefault();
      }

      function handlePointerMove(event) {
        var disc = state.discs.find(function (item) {
          return item.pointerId === event.pointerId && item.dragging;
        });
        if (!disc) return;

        var svgPoint = getSvgPoint(event);
        var hitType = refs.hitTarget && refs.hitTarget.hasAttribute("data-hit-side") ? "side" : "top";
        var pointerAngle = getExtendedPointerAngle(disc, svgPoint, hitType);
        if (pointerAngle == null) return;

        var deltaAngle = angleDelta(pointerAngle, disc.lastPointerAngle);
        var now = event.timeStamp || performance.now();
        var elapsed = Math.max(8, now - (disc.lastMoveTime || now));

        disc.angle = normalizeAngle(disc.angle + deltaAngle);
        disc.lastPointerAngle = pointerAngle;
        disc.lastMoveTime = now;
        disc.angularVelocity = deltaAngle / (elapsed / 1000);
        updateRotor(disc);
        event.preventDefault();
      }

      function handlePointerUp(event) {
        if (refs.hitTarget && typeof refs.hitTarget.releasePointerCapture === "function") {
          try {
            refs.hitTarget.releasePointerCapture(event.pointerId);
          } catch (err) {
            /* ignore */
          }
        }
        releaseDisc(event.pointerId);
      }

      function handleRangeInput(event) {
        var input = event.target.closest('input[type="range"]');
        if (!input) return;

        var target = input.getAttribute("data-target");
        var key = input.getAttribute("data-key");
        var value = Number(input.value);

        if (target === "global") {
          state.global[key] = value;
        } else {
          var disc = getDiscById(target);
          if (!disc) return;
          disc[key] = value;
        }

        updateControlDisplays();
        renderTurntable();
        updateConfigOutput();
      }

      function copyConfig() {
        var text = refs.configOutput.value;
        if (!navigator.clipboard) {
          refs.configOutput.focus();
          refs.configOutput.select();
          document.execCommand("copy");
          return;
        }

        navigator.clipboard.writeText(text).then(function () {
          refs.copyButton.textContent = "已复制";
          window.setTimeout(function () {
            refs.copyButton.textContent = "复制配置";
          }, 1200);
        }).catch(function () {
          refs.configOutput.focus();
          refs.configOutput.select();
          document.execCommand("copy");
        });
      }

      function tick(timestamp) {
        if (!state.lastTick) {
          state.lastTick = timestamp;
        }

        var delta = Math.min((timestamp - state.lastTick) / 1000, 0.04);
        state.lastTick = timestamp;

        state.discs.forEach(function (disc) {
          if (disc.dragging) return;
          if (Math.abs(disc.angularVelocity) > 0.01) {
            disc.angle = normalizeAngle(disc.angle + (disc.angularVelocity * delta * disc.inertiaBoost));
            disc.angularVelocity *= Math.pow(0.88, delta * 60);
          } else {
            disc.angularVelocity = 0;
            disc.angle = normalizeAngle(disc.angle + (disc.autoSpeed * delta));
          }
          updateRotor(disc);
        });

        refs.rafId = window.requestAnimationFrame(tick);
      }

      function startTopCarousel() {
        if (refs.carouselTimer) {
          window.clearInterval(refs.carouselTimer);
        }

        refs.carouselTimer = window.setInterval(function () {
          state.carouselIndex = (state.carouselIndex + 1) % TOP_SIDE_IMAGES.length;
          renderTurntable();
        }, 1400);
      }

      function bindEvents() {
        refs.turntableRoot.addEventListener("pointerdown", handlePointerDown);
        refs.turntableRoot.addEventListener("pointermove", handlePointerMove);
        refs.turntableRoot.addEventListener("pointerup", handlePointerUp);
        refs.turntableRoot.addEventListener("pointercancel", handlePointerUp);
        refs.turntableRoot.addEventListener("lostpointercapture", handlePointerUp);
        refs.controlsRoot = document.querySelector(".controls-root");
        refs.controlsRoot.addEventListener("input", handleRangeInput);
        refs.copyButton.addEventListener("click", copyConfig);
      }

      function init() {
        state.carouselIndex = 0;
        renderControls();
        updateControlDisplays();
        renderTurntable();
        updateStatus();
        updateConfigOutput();
        bindEvents();
        startTopCarousel();
        refs.rafId = window.requestAnimationFrame(tick);
      }

      init();
    })();
  </script>
</body>
</html>
